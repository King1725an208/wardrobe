[tool.poetry]
name = "app"
version = "0.1.0"
description = "CORS proxy for Volcano Ark (doubao) API used by the wardrobe PWA"
authors = ["wardrobe <wardrobe@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
